name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ControleParental.apk

      - name: Guardar APK (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: ControleParental-apk
          path: ControleParental.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: Controle Parental (build ${{ github.run_number }})
          body: Baixe o arquivo ControleParental.apk no celular e toque nele para instalar.
          files: ControleParental.apk
